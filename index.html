<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SimoDevel - Electronics and Mechatronics Learning Hub</title>
  <meta name="description" content="Technical tutorials, projects, tools and parts for electronics and mechatronics learners. Non-profit and community-driven.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
    }

    .topbar {
      background: #111827;
      border-bottom: 3px solid #dc2626;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo {
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      text-decoration: none;
      letter-spacing: -0.4px;
    }

    .logo span { color: #dc2626; }

    .nav-btn {
      background: transparent;
      border: 0;
      color: #d1d5db;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
    }

    .nav-btn:hover,
    .nav-btn.active {
      color: #ffffff;
      border-color: #dc2626;
    }

    .register-link {
      color: #fca5a5;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .register-link:hover { color: #fecaca; }

    .nav-link {
      color: #d1d5db;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 0;
      border-bottom: 2px solid transparent;
    }

    .nav-link:hover {
      color: #ffffff;
      border-color: #dc2626;
    }

    .search-wrap {
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }

    .search-box { position: relative; }

    .search-input {
      width: 100%;
      border: 2px solid #d1d5db;
      border-radius: 3px;
      padding: 11px 14px 11px 40px;
      font-size: 15px;
      color: #111827;
      background: #ffffff;
    }

    .search-input:focus {
      outline: none;
      border-color: #111827;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      pointer-events: none;
    }

    .status-line {
      font-family: "Courier New", monospace;
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
    }

    .status-focus-fixed {
      display: inline-block;
      width: 17ch;
    }

    .status-focus-label {
      display: inline-block;
      width: 9ch;
    }

    .status-jump {
      font-family: inherit;
      font-size: inherit;
      color: #374151;
      background: transparent;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .status-jump:hover {
      color: #111827;
    }

    .layout {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px 16px 10px;
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(290px, 1fr);
      gap: 22px;
    }

    .layout.focus-mode {
      grid-template-columns: 1fr;
      max-width: 1280px;
    }

    .layout.expanded-view {
      position: relative;
      top: auto;
      left: auto;
      right: auto;
      bottom: auto;
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px 16px 10px;
      overflow: visible;
      background: transparent;
      z-index: auto;
    }

    .layout.expanded-view > aside {
      display: none;
    }

    .layout.expanded-view > section {
      width: 100%;
    }

    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
    }

    .sec-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 900;
      color: #6b7280;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 6px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-pill {
      font-family: "Courier New", monospace;
      font-size: 10px;
      border: 1px solid #d1d5db;
      background: #f3f4f6;
      color: #4b5563;
      border-radius: 2px;
      padding: 1px 5px;
    }

    .count-nav-btn {
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: 800;
      color: #374151;
      background: transparent;
      border: 0;
      padding: 0 2px;
      cursor: pointer;
    }

    .count-nav-btn:hover {
      color: #111827;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .topic-toolbar {
      position: sticky;
      top: 64px;
      z-index: 45;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 6px;
    }

    .topic-toggle {
      border: 1px solid #d1d5db;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      color: #4b5563;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 10px;
      cursor: pointer;
      letter-spacing: 0.04em;
      backdrop-filter: blur(2px);
      box-shadow: 0 1px 6px rgba(17, 24, 39, 0.08);
      transition: all 0.15s ease;
    }

    .topic-toggle:hover {
      color: #111827;
      border-color: #9ca3af;
      background: #ffffff;
    }

    .topic-toggle.active {
      color: #374151;
      background: #e5e7eb;
      border-color: #9ca3af;
    }

    .topic-rating-row {
      margin-top: 6px;
    }

    .vote-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .vote-stars {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      position: relative;
      top: -1px;
    }

    .vote-star {
      border: 0;
      background: transparent;
      color: #d1d5db;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      padding: 0 1px;
    }

    .vote-star.active {
      color: #f59e0b;
    }

    .vote-star:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .vote-inline-summary {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #4b5563;
      font-family: "Courier New", monospace;
      font-size: 14px;
      position: relative;
      top: 0;
      transform: translateY(10%);
      line-height: 1;
    }

    .vote-avg {
      color: #374151;
      font-weight: 700;
    }

    .vote-count {
      color: #9ca3af;
      font-weight: 700;
    }

    .list-vote-quiet {
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
    }

    .list-vote-star {
      color: #d1d5db;
      font-size: 20px;
      line-height: 1;
    }

    .list-vote-star.active {
      color: #f59e0b;
    }

    .list-vote-summary {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      margin-left: 6px;
      position: relative;
      top: 0;
      transform: translateY(25%);
      line-height: 1;
    }

    .list-vote-avg {
      color: #4b5563;
      font-family: "Courier New", monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1;
    }

    .list-vote-count {
      color: #9ca3af;
      font-family: "Courier New", monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1;
    }

    .panel {
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background: #ffffff;
      padding: 12px;
      margin-bottom: 14px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 760px) {
      .card-grid { grid-template-columns: 1fr; }
    }

    .tech-card {
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-bottom: 1px solid #e5e7eb;
      background: #f3f4f6;
    }

    .card-body {
      padding: 9px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title {
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #111827;
      line-height: 1.35;
    }

    .card-desc {
      font-size: 12px;
      color: #4b5563;
      line-height: 1.45;
    }

    .tag {
      display: inline-block;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid #d1d5db;
      background: #f3f4f6;
      color: #374151;
      border-radius: 2px;
      padding: 1px 5px;
    }

    .difficulty-pill {
      display: inline-block;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: 800;
      border-radius: 2px;
      padding: 1px 6px;
      text-transform: uppercase;
    }

    .diff-beginner {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .diff-intermediate {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
    }

    .diff-advanced {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .meta {
      font-size: 11px;
      color: #6b7280;
      font-family: "Courier New", monospace;
    }

    .blog-detail-title {
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.25;
      letter-spacing: 0.03em;
      color: #111827;
      margin-top: 10px;
    }

    .detail-section-title {
      font-size: 11px;
      font-family: "Courier New", monospace;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4b5563;
      margin-bottom: 4px;
    }

    .clickable {
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }

    .clickable:hover {
      border-color: #9ca3af;
      transform: translateY(-1px);
    }

    .compact-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 330px;
      overflow-y: auto;
      padding-right: 3px;
    }

    .compact-item {
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 8px;
      background: #fff;
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 8px;
      align-items: start;
    }

    .compact-item img {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 3px;
      border: 1px solid #e5e7eb;
      background: #f3f4f6;
    }

    .compact-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.3;
      color: #111827;
    }

    .parts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    @media (max-width: 800px) {
      .parts-grid { grid-template-columns: 1fr; }
    }

    .part-card {
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 8px;
      background: #fff;
    }

    .detail-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .readme-content {
      margin-top: 4px;
      font-size: 12px;
      color: #374151;
      border: 1px solid #e5e7eb;
      border-radius: 3px;
      background: #f9fafb;
      padding: 10px;
    }

    .readme-content h1,
    .readme-content h2,
    .readme-content h3 {
      margin: 0 0 8px;
      color: #111827;
      line-height: 1.35;
      font-weight: 900;
    }

    .readme-content h1 {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .readme-content h2 {
      margin-top: 12px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .readme-content h3 {
      margin-top: 10px;
      font-size: 12px;
      text-transform: uppercase;
    }

    .readme-content p {
      margin: 0 0 8px;
      line-height: 1.6;
    }

    .readme-content ul {
      margin: 0 0 10px;
      padding-left: 18px;
    }

    .readme-content ol {
      margin: 0 0 10px;
      padding-left: 18px;
    }

    .readme-content li {
      margin-bottom: 4px;
      line-height: 1.5;
    }

    .readme-content code {
      font-family: "Courier New", monospace;
      font-size: 11px;
      background: #e5e7eb;
      border-radius: 2px;
      padding: 1px 4px;
      color: #111827;
    }

    .readme-content a {
      color: #1f2937;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .readme-content blockquote {
      margin: 0 0 10px;
      border-left: 3px solid #d1d5db;
      padding: 6px 10px;
      background: #f3f4f6;
      color: #374151;
    }

    .readme-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 10px;
      table-layout: fixed;
    }

    .readme-content th,
    .readme-content td {
      border: 1px solid #d1d5db;
      padding: 6px 8px;
      vertical-align: top;
      word-break: break-word;
    }

    .readme-content th {
      background: #e5e7eb;
      color: #1f2937;
      font-weight: 800;
      text-align: left;
    }

    .parts-table-wrap {
      margin-top: 4px;
    }

    .parts-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      table-layout: fixed;
    }

    .parts-table th,
    .parts-table td {
      border: 1px solid #e5e7eb;
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
      word-break: break-word;
    }

    .parts-table th {
      background: #f3f4f6;
      font-family: "Courier New", monospace;
      font-size: 11px;
      color: #4b5563;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .part-ref {
      font-family: "Courier New", monospace;
      font-size: 12px;
      font-weight: 800;
      color: #111827;
    }

    .buy-link {
      display: inline-block;
      font-family: "Courier New", monospace;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid #d1d5db;
      border-radius: 2px;
      color: #374151;
      text-decoration: none;
      padding: 2px 6px;
      margin-right: 4px;
      margin-top: 3px;
    }

    .buy-link:hover {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    .tools-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 760px) {
      .tools-list { grid-template-columns: 1fr; }
    }

    .tool-card {
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 9px;
      background: #fff;
    }

    .tool-name {
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 900;
      color: #111827;
      margin-bottom: 4px;
    }

    .tool-meta {
      font-family: "Courier New", monospace;
      font-size: 10px;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .empty-msg {
      font-family: "Courier New", monospace;
      color: #9ca3af;
      font-size: 12px;
      padding: 10px 0;
    }

    .about-box {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px 24px;
    }

    .mission {
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      background: #ffffff;
      padding: 14px;
    }

    footer {
      margin-top: 10px;
      background: #111827;
      color: #9ca3af;
      font-family: "Courier New", monospace;
      font-size: 11px;
      padding: 12px 16px;
      text-align: center;
    }
  </style>
</head>
<body x-data="simodevel()" x-init="init()">
  <nav class="topbar">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <a :href="link('home')" class="logo">Simo<span>Devel</span></a>
      <div class="flex flex-wrap items-center gap-4">
        <button class="nav-btn" :class="isNavActive('blog') ? 'active' : ''" @click="setPanel('blog')" x-text="t('nav.blog')"></button>
        <button class="nav-btn" :class="isNavActive('parts') ? 'active' : ''" @click="setPanel('parts')" x-text="t('nav.parts')"></button>
        <button class="nav-btn" :class="isNavActive('tutorials') ? 'active' : ''" @click="setPanel('tutorials')" x-text="t('nav.tutorials')"></button>
        <button class="nav-btn" :class="isNavActive('tools') ? 'active' : ''" @click="setPanel('tools')" x-text="t('nav.tools')"></button>
        <a class="nav-link" :href="link('about')" x-text="t('nav.about')"></a>
        <a class="register-link" :href="link('contribute')" x-text="t('nav.register')"></a>
      </div>
    </div>
  </nav>

  <div class="search-wrap px-4 py-4">
    <div class="max-w-7xl mx-auto">
      <div class="search-box">
        <svg class="search-icon w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input
          class="search-input"
          type="text"
          :placeholder="t('search.placeholder')"
          x-model="query"
          @input.debounce.120ms="filterAll()"
          @keydown.escape="query=''; filterAll()"
        >
      </div>
      <div class="status-line" x-cloak>
        <template x-if="loading">
          <span x-text="t('status.loading')"></span>
        </template>
        <template x-if="!loading && isSearchMode()">
          <span x-text="searchStatusText()"></span>
        </template>
        <template x-if="!loading && !isSearchMode()">
          <span>
            <span class="status-focus-fixed"><span x-text="t('status.focus')"></span> <span class="font-bold status-focus-label" x-text="panelFocus === 'default' ? t('status.overview') : panelFocus.toUpperCase()"></span></span>
            <span x-text="t('status.sectionsLoaded')"></span>
            <button type="button" class="status-jump" @click="jumpToPanel('blog')"><span x-text="stats.projects"></span> <span x-text="t('status.projects')"></span></button>,
            <button type="button" class="status-jump" @click="jumpToPanel('parts')"><span x-text="stats.components"></span> <span x-text="t('status.parts')"></span></button>,
            <button type="button" class="status-jump" @click="jumpToPanel('tutorials')"><span x-text="stats.tutorials"></span> <span x-text="t('status.tutorials')"></span></button>,
            <button type="button" class="status-jump" @click="jumpToPanel('tools')"><span x-text="stats.tools"></span> <span x-text="t('status.tools')"></span></button>.
          </span>
        </template>
      </div>
    </div>
  </div>

  <main class="layout" :class="{ 'focus-mode': hasSelectedTopic() && isExpandedView, 'expanded-view': hasSelectedTopic() && isExpandedView }" x-cloak>
    <section>
      <!-- LARGE BLOG -->
      <div class="panel" x-show="showLarge('blog') && visible.projects.length > 0">
        <div class="sec-title">
          <span x-text="t('sections.blog')"></span>
          <span class="count-pill" x-show="!selectedBlog()" x-text="visible.projects.length"></span>
          <span class="count-pill" x-show="selectedBlog()">
            <button type="button" class="count-nav-btn" @click="openPrevBlog()" :title="t('navTitles.prevBlog')" x-text="selectedBlogIndex() + 1"></button>
            <span>/</span>
            <button type="button" class="count-nav-btn" @click="openNextBlog()" :title="t('navTitles.nextBlog')" x-text="visible.projects.length"></button>
          </span>
        </div>
        <template x-if="selectedBlog()">
          <article>
            <div class="topic-toolbar">
              <button
                type="button"
                class="topic-toggle"
                :class="isExpandedView ? 'active' : ''"
                @click="toggleExpand()"
                x-text="isExpandedView ? t('actions.minimize') : t('actions.enlarge')"
              ></button>
            </div>
            <button class="buy-link" @click="closeBlogDetail()" x-text="t('actions.backBlogs')"></button>
            <img class="thumb" :src="selectedBlog().image" :alt="selectedBlog().title" style="margin-top:8px;">
            <h2 class="blog-detail-title" x-text="selectedBlog().title"></h2>
            <div class="topic-rating-row">
              <div class="vote-actions">
                <div class="vote-stars">
                  <template x-for="star in [1,2,3,4,5]" :key="'blog-star-' + star">
                    <button
                      type="button"
                      class="vote-star"
                      :class="currentVoteState().userStars >= star ? 'active' : ''"
                      :title="star + ' stars'"
                      @click="setStarVote(star)"
                      :disabled="voteBusy || !voteApiAvailable"
                    >&#9733;</button>
                  </template>
                </div>
                <div class="vote-inline-summary">

    function isPlainObject(value) {
      return value !== null && typeof value === "object" && !Array.isArray(value);
    }

    function mergeObjects(base, incoming) {
      if (!isPlainObject(base) || !isPlainObject(incoming)) {
        return isPlainObject(incoming) ? { ...incoming } : base;
      }

      const output = { ...base };
      for (const key of Object.keys(incoming)) {
        const baseValue = base[key];
        const incomingValue = incoming[key];
        if (isPlainObject(baseValue) && isPlainObject(incomingValue)) {
          output[key] = mergeObjects(baseValue, incomingValue);
        } else {
          output[key] = incomingValue;
        }
      }
      return output;
    }

    function getByPath(source, path, fallbackValue = "") {
      const chunks = String(path || "").split('.').filter(Boolean);
      let current = source;
      for (const chunk of chunks) {
        if (current === null || typeof current !== "object" || !(chunk in current)) {
          return fallbackValue;
        }
        current = current[chunk];
      }
      if (current === undefined || current === null) {
        return fallbackValue;
      }
      return current;
    }

    function simodevel() {
      return {
        loading: true,
        query: "",
        panelFocus: "default",
        selectedBlogId: null,
        selectedTutorialId: null,
        selectedPartRef: null,
        selectedToolId: null,
        isExpandedView: false,
        stats: { projects: 0, components: 0, tutorials: 0, tools: 0 },
        blogAssets: {},
        tutorialAssets: {},
        voteApiBase: "/api/votes",
        voteApiAvailable: false,
        voteDeviceId: "",
        votesByKey: {},
        voteBusy: false,
        ui: defaultUiConfig(),

        raw: {
          projects: [],
          components: [],
          tutorials: [],
          tools: []
        },

        visible: {
          projects: [],
          components: [],
          tutorials: [],
          tools: []
        },

        async init() {
          const uiDefaults = defaultUiConfig();
          this.ui = uiDefaults;

          try {
            const cfgResponse = await fetch("data/ui_config.json");
            if (cfgResponse.ok) {
              const cfgPayload = await cfgResponse.json();
              this.ui = mergeObjects(uiDefaults, cfgPayload);
            }
          } catch (_) {
            this.ui = uiDefaults;
          }

          this.applySeoConfig();
          this.panelFocus = this.defaultPanelFocus();

          this.voteApiBase = this.resolveVoteApiBase();
          this.voteApiAvailable = window.location.protocol === "http:" || window.location.protocol === "https:";
          this.voteDeviceId = this.ensureVoteDeviceId();

          try {
            const dataPaths = this.ui.dataPaths || {};
            const bundlePath = String(dataPaths.bundle || "").trim();
            let loadedBundle = false;

            if (bundlePath) {
              try {
                const bundleRes = await fetch(bundlePath);
                if (bundleRes.ok) {
                  const bundlePayload = await bundleRes.json();
                  const bundleData = this.extractBundleData(bundlePayload);
                  if (bundleData) {
                    this.applyLoadedData(bundleData);
                    loadedBundle = true;
                  }
                }
              } catch (_) {
                loadedBundle = false;
              }
            }

            if (!loadedBundle) {
              const [projects, componentsSource, tutorials, tools] = await Promise.all([
                fetch(dataPaths.projects || "data/projects_index.json").then(r => r.json()),
                fetch(dataPaths.components || "data/components.json").then(r => r.json()),
                fetch(dataPaths.tutorials || "data/tutorials_index.json").then(r => r.json()),
                fetch(dataPaths.tools || "data/tools_index.json").then(r => r.json())
              ]);

              this.applyLoadedData({
                projects,
                components: this.normalizeComponents(componentsSource),
                tutorials,
                tools
              });
            }
          } catch (err) {
            console.warn("Could not load local JSON data", err);
          } finally {
            this.loading = false;
          }
        },

        cfg(path, fallbackValue = null) {
          return getByPath(this.ui || {}, path, fallbackValue);
        },

        cfgArray(path, fallbackValue = []) {
          const value = this.cfg(path, fallbackValue);
          return Array.isArray(value) ? value : fallbackValue;
        },

        defaultPanelFocus() {
          return String(this.cfg("defaults.panelFocus", "default") || "default");
        },

        defaultLargePanels() {
          return this.cfgArray("defaults.largeWhenDefault", ["blog", "parts"]);
        },

        defaultCompactPanels() {
          return this.cfgArray("defaults.compactWhenDefault", ["tutorials", "tools"]);
        },

        defaultCompactOrder() {
          return this.cfgArray("defaults.compactOrder", ["blog", "parts", "tutorials", "tools"]);
        },

        defaultNavPanel() {
          const panels = this.defaultLargePanels();
          return panels.length ? String(panels[0]) : "blog";
        },

        applySeoConfig() {
          const title = String(this.cfg("seo.title", "") || "").trim();
          if (title) {
            document.title = title;
          }

          const description = String(this.cfg("seo.description", "") || "").trim();
          if (!description) {
            return;
          }

          const descriptionMeta = document.querySelector('meta[name="description"]');
          if (descriptionMeta) {
            descriptionMeta.setAttribute("content", description);
          }
        },

        normalizeComponents(componentsSource) {
          if (Array.isArray(componentsSource)) {
            return componentsSource
              .filter(item => item && typeof item === "object")
              .map(item => {
                const ref = item._ref || item.ref || item.id || "";
                return {
                  ...item,
                  _ref: ref
                };
              })
              .filter(item => item._ref);
          }

          if (isPlainObject(componentsSource)) {
            return Object.keys(componentsSource).map(ref => ({
              _ref: ref,
              ...(componentsSource[ref] || {})
            }));
          }

          return [];
        },

        extractBundleData(bundlePayload) {
          if (!isPlainObject(bundlePayload)) {
            return null;
          }

          return {
            projects: Array.isArray(bundlePayload.projects) ? bundlePayload.projects : [],
            components: this.normalizeComponents(bundlePayload.components || []),
            tutorials: Array.isArray(bundlePayload.tutorials) ? bundlePayload.tutorials : [],
            tools: Array.isArray(bundlePayload.tools) ? bundlePayload.tools : []
          };
        },

        applyLoadedData(dataPayload = {}) {
          this.raw.projects = Array.isArray(dataPayload.projects) ? dataPayload.projects : [];
          this.raw.components = Array.isArray(dataPayload.components) ? dataPayload.components : [];
          this.raw.tutorials = Array.isArray(dataPayload.tutorials) ? dataPayload.tutorials : [];
          this.raw.tools = Array.isArray(dataPayload.tools) ? dataPayload.tools : [];

          this.stats = {
            projects: this.raw.projects.length,
            components: this.raw.components.length,
            tutorials: this.raw.tutorials.length,
            tools: this.raw.tools.length
          };

          this.filterAll();
        },

        t(path, fallbackValue = "") {
          return String(getByPath(this.ui.texts || {}, path, fallbackValue));
        },

        link(name) {
          return String(getByPath(this.ui.links || {}, name, "#"));
        },

        limit(path, fallbackValue = 0) {
          const value = Number(getByPath(this.ui.limits || {}, path, fallbackValue));
          return Number.isFinite(value) ? value : Number(fallbackValue || 0);
        },

        formatTemplate(template, vars = {}) {
          return String(template || "").replace(/\{([a-zA-Z0-9_]+)\}/g, (_, token) => {
            if (!(token in vars)) {
              return "";
            }
            return String(vars[token] ?? "");
          });
        },

        searchStatusText() {
          return this.formatTemplate(this.t("status.search"), {
            count: this.totalResults(),
            query: this.query
          });
        },

        submittedByText(item) {
          return this.formatTemplate(this.t("dynamic.submittedBy"), {
            contributor: item && item.contributor ? item.contributor : ""
          });
        },

        blogOverviewText(item) {
          return this.formatTemplate(this.t("dynamic.blogOverview"), {
            category: item && item.category ? item.category : "",
            difficulty: item && item.difficulty ? item.difficulty : ""
          });
        },

        tutorialOverviewText(item) {
          return this.formatTemplate(this.t("dynamic.tutorialOverview"), {
            category: item && item.category ? item.category : "",
            difficulty: item && item.difficulty ? item.difficulty : ""
          });
        },

        toolInstallText(tool) {
          const installValue = (tool && tool.install) ? tool.install : this.t("fallback.toolInstall");
          return this.formatTemplate(this.t("dynamic.toolInstallPrefix"), {
            value: installValue
          });
        },

        isSearchMode() {
          return this.query.trim().length > 0;
        },

        normalize(v) {
          return String(v || "").toLowerCase();
        },

        hit(value, q) {
          return this.normalize(value).includes(q);
        },

        hitTags(arr, q) {
          return (arr || []).some(tag => this.hit(tag, q));
        },

        filterAll() {
          const q = this.normalize(this.query.trim());

          if (q) {
            this.selectedBlogId = null;
            this.selectedTutorialId = null;
            this.selectedPartRef = null;
            this.selectedToolId = null;
            this.isExpandedView = false;
          }

          if (!q) {
            this.visible.projects = this.raw.projects.slice(0, this.limit("default.projects", 10));
            this.visible.components = this.raw.components.slice(0, this.limit("default.components", 20));
            this.visible.tutorials = this.raw.tutorials.slice(0, this.limit("default.tutorials", 10));
            this.visible.tools = this.raw.tools.slice(0, this.limit("default.tools", 10));
            this.prefetchVisibleVoteSummaries();
            return;
          }

          this.visible.projects = this.raw.projects.filter(item =>
            this.hit(item.title, q) ||
            this.hit(item.description, q) ||
            this.hit(item.category, q) ||
            this.hit(item.contributor, q) ||
            this.hitTags(item.tags, q)
          ).slice(0, this.limit("search.projects", 20));

          this.visible.components = this.raw.components.filter(item =>
            this.hit(item._ref, q) ||
            this.hit(item.type, q) ||
            this.hit(item.package, q) ||
            this.hit(item.manufacturer, q)
          ).slice(0, this.limit("search.components", 30));

          this.visible.tutorials = this.raw.tutorials.filter(item =>
            this.hit(item.title, q) ||
            this.hit(item.description, q) ||
            this.hit(item.category, q) ||
            this.hit(item.contributor, q) ||
            this.hitTags(item.tags, q)
          ).slice(0, this.limit("search.tutorials", 20));

          this.visible.tools = this.raw.tools.filter(item =>
            this.hit(item.name, q) ||
            this.hit(item.title, q) ||
            this.hit(item.category, q) ||
            this.hit(item.description, q) ||
            this.hit(item.install, q) ||
            this.hit(item.license, q) ||
            this.hit(item.free_version, q) ||
            this.hit(item.version, q)
          ).slice(0, this.limit("search.tools", 20));

          if (this.selectedBlogId && !this.visible.projects.some(item => item.id === this.selectedBlogId)) {
            this.selectedBlogId = null;
          }
          if (this.selectedTutorialId && !this.visible.tutorials.some(item => item.id === this.selectedTutorialId)) {
            this.selectedTutorialId = null;
          }
          if (this.selectedPartRef && !this.visible.components.some(c => c._ref === this.selectedPartRef)) {
            this.selectedPartRef = null;
          }
          if (this.selectedToolId && !this.visible.tools.some(t => t.id === this.selectedToolId)) {
            this.selectedToolId = null;
          }

          if (!this.selectedBlogId && !this.selectedTutorialId && !this.selectedPartRef && !this.selectedToolId) {
            this.isExpandedView = false;
          }

          this.prefetchVisibleVoteSummaries();
        },

        hasSelectedTopic() {
          return !!(this.selectedBlogId || this.selectedTutorialId || this.selectedPartRef || this.selectedToolId);
        },

        toggleExpand() {
          this.isExpandedView = !this.isExpandedView;
        },

        closeBlogDetail() {
          this.selectedBlogId = null;
          this.isExpandedView = false;
        },

        closeTutorialDetail() {
          this.selectedTutorialId = null;
          this.isExpandedView = false;
        },

        closePartDetail() {
          this.selectedPartRef = null;
          this.isExpandedView = false;
        },

        closeToolDetail() {
          this.selectedToolId = null;
          this.isExpandedView = false;
        },

        defaultVoteState() {
          return {
            totalVotes: 0,
            avgStars: 0,
            userStars: 0,
            loaded: false,
            loading: false,
            error: ""
          };
        },

        voteStarClass(star, average) {
          const rounded = Math.round(Number(average || 0));
          return rounded >= Number(star || 0) ? "active" : "";
        },

        voteStateForKey(itemKey) {
          return this.votesByKey[itemKey] || this.defaultVoteState();
        },

        blogVoteSummary(id) {
          return this.voteStateForKey(`blog:${id}`);
        },

        tutorialVoteSummary(id) {
          return this.voteStateForKey(`tutorial:${id}`);
        },

        prefetchVisibleVoteSummaries() {
          if (!this.voteApiAvailable) {
            return;
          }

          for (const item of this.visible.projects || []) {
            if (item && item.id) {
              this.loadVotesForKey(`blog:${item.id}`);
            }
          }

          for (const item of this.visible.tutorials || []) {
            if (item && item.id) {
              this.loadVotesForKey(`tutorial:${item.id}`);
            }
          }
        },

        formatVoteAverage(value) {
          const n = Number(value || 0);
          return Number.isFinite(n) ? n.toFixed(2) : "0.00";
        },

        resolveVoteApiBase() {
          const host = String(window.location.hostname || "").toLowerCase();
          const voteCfg = this.ui.vote || {};
          const localBase = String(voteCfg.apiBase || "/api/votes");
          if (host.endsWith("github.io")) {
            return String(voteCfg.githubIoApiBase || localBase);
          }
          return localBase;
        },

        async parseVoteApiResponse(response, defaultErrorMessage) {
          const contentType = String(response.headers.get("content-type") || "").toLowerCase();
          const payloadText = await response.text();

          if (!contentType.includes("application/json")) {
            if (response.status === 404 || response.status === 405) {
              throw new Error(this.t("messages.voteRouteInactive"));
            }
            throw new Error(this.t("messages.voteNonJson"));
          }

          let data;
          try {
            data = payloadText ? JSON.parse(payloadText) : {};
          } catch (_) {
            throw new Error(this.t("messages.voteInvalidJson"));
          }

          if (!response.ok || !data.ok) {
            throw new Error(data.error || defaultErrorMessage);
          }

          return data;
        },

        ensureVoteDeviceId() {
          const storageKey = "simo_vote_device_id_v1";
          try {
            const existing = localStorage.getItem(storageKey);
            if (existing) {
              return existing;
            }

            const generated = (typeof crypto !== "undefined" && crypto.randomUUID)
              ? crypto.randomUUID()
              : `anon-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
            localStorage.setItem(storageKey, generated);
            return generated;
          } catch (_) {
            return `anon-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
          }
        },

        selectedVoteTarget() {
          if (this.selectedBlogId) {
            return { key: `blog:${this.selectedBlogId}` };
          }
          if (this.selectedTutorialId) {
            return { key: `tutorial:${this.selectedTutorialId}` };
          }
          return null;
        },

        upsertVoteState(key, payload = {}) {
          const previous = this.votesByKey[key] || this.defaultVoteState();
          this.votesByKey = {
            ...this.votesByKey,
            [key]: {
              ...previous,
              ...payload
            }
          };
          return this.votesByKey[key];
        },

        currentVoteState() {
          const target = this.selectedVoteTarget();
          if (!target) {
            return this.defaultVoteState();
          }
          return this.votesByKey[target.key] || this.defaultVoteState();
        },

        async loadVotesForKey(itemKey) {
          if (!itemKey || !this.voteApiAvailable) {
            return;
          }

          const known = this.votesByKey[itemKey];
          if (known && (known.loading || known.loaded)) {
            return;
          }

          this.upsertVoteState(itemKey, { error: "", loading: true });

          try {
            const query = `${this.voteApiBase}?item=${encodeURIComponent(itemKey)}&device=${encodeURIComponent(this.voteDeviceId)}`;
            const response = await fetch(query);
            const data = await this.parseVoteApiResponse(response, this.t("messages.voteLoadError"));

            this.upsertVoteState(itemKey, {
              totalVotes: Number(data.stats && data.stats.totalVotes || 0),
              avgStars: Number(data.stats && data.stats.avgStars || 0),
              userStars: Number(data.viewer && data.viewer.stars || 0),
              loaded: true,
              loading: false,
              error: ""
            });
          } catch (err) {
            const message = err && err.message ? err.message : this.t("messages.voteLoadError");
            this.upsertVoteState(itemKey, {
              loading: false,
              error: message
            });
          }
        },

        async voteForCurrent(stars) {
          const target = this.selectedVoteTarget();
          if (!target) {
            return;
          }

          if (!this.voteApiAvailable) {
            this.upsertVoteState(target.key, {
              error: this.t("messages.voteDomainOnly")
            });
            return;
          }

          if (this.voteBusy) {
            return;
          }

          this.voteBusy = true;
          this.upsertVoteState(target.key, { error: "" });

          try {
            const response = await fetch(this.voteApiBase, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                item: target.key,
                deviceId: this.voteDeviceId,
                liked: false,
                stars: Number(stars || 0)
              })
            });

            const data = await this.parseVoteApiResponse(response, this.t("messages.voteRequestFailed"));

            this.upsertVoteState(target.key, {
              totalVotes: Number(data.stats && data.stats.totalVotes || 0),
              avgStars: Number(data.stats && data.stats.avgStars || 0),
              userStars: Number(data.viewer && data.viewer.stars || 0),
              loaded: true,
              loading: false,
              error: ""
            });
          } catch (err) {
            const message = err && err.message ? err.message : this.t("messages.voteRequestFailed");
            this.upsertVoteState(target.key, {
              loading: false,
              error: message
            });
          } finally {
            this.voteBusy = false;
          }
        },

        async setStarVote(stars) {
          const safeStars = Math.max(1, Math.min(5, Number(stars || 0)));
          await this.voteForCurrent(safeStars);
        },

        openBlog(id) {
          this.panelFocus = "blog";
          this.isExpandedView = false;
          this.selectedBlogId = id;
          const project = this.raw.projects.find(item => item.id === id) || null;
          if (project) {
            this.ensureBlogAssets(project);
          }
          this.loadVotesForKey(`blog:${id}`);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        async ensureBlogAssets(project) {
          if (!project || !project.id) {
            return;
          }

          const cached = this.blogAssets[project.id];
          if (cached && cached.loaded) {
            return;
          }

          const inlineReadme = String(
            project.readme_text ||
            project.readmeText ||
            project.content_md ||
            project.contentMd ||
            ""
          ).trim();

          const inlineParts =
            (Array.isArray(project.parts_list) && project.parts_list) ||
            (Array.isArray(project.partsList) && project.partsList) ||
            (Array.isArray(project.inline_parts) && project.inline_parts) ||
            [];

          let readmeText = inlineReadme || this.t("fallback.contentUnavailable");
          let partsList = inlineParts;

          if (project.readme && !inlineReadme) {
            try {
              const readmeRes = await fetch(project.readme);
              if (readmeRes.ok) {
                const txt = (await readmeRes.text()).trim();
                if (txt) {
                  readmeText = txt;
                }
              }
            } catch (_) {
              readmeText = this.t("fallback.contentUnavailable");
            }
          }

          if (project.parts && !partsList.length) {
            try {
              const partsRes = await fetch(project.parts);
              if (partsRes.ok) {
                const parsed = await partsRes.json();
                if (Array.isArray(parsed)) {
                  partsList = parsed;
                }
              }
            } catch (_) {
              partsList = [];
            }
          }

          this.blogAssets[project.id] = {
            loaded: true,
            readmeText,
            partsList
          };
        },

        selectedBlog() {
          if (!this.selectedBlogId) {
            return null;
          }
          return this.visible.projects.find(item => item.id === this.selectedBlogId) || null;
        },

        selectedBlogIndex() {
          if (!this.selectedBlogId) {
            return -1;
          }
          return this.visible.projects.findIndex(item => item.id === this.selectedBlogId);
        },

        openPrevBlog() {
          if (!this.visible.projects.length) {
            return;
          }
          const index = this.selectedBlogIndex();
          if (index < 0) {
            return;
          }
          const prevIndex = (index - 1 + this.visible.projects.length) % this.visible.projects.length;
          this.openBlog(this.visible.projects[prevIndex].id);
        },

        openNextBlog() {
          if (!this.visible.projects.length) {
            return;
          }
          const index = this.selectedBlogIndex();
          if (index < 0) {
            return;
          }
          const nextIndex = (index + 1) % this.visible.projects.length;
          this.openBlog(this.visible.projects[nextIndex].id);
        },

        selectedBlogReadme() {
          const blog = this.selectedBlog();
          if (!blog) {
            return this.t("fallback.contentUnavailable");
          }
          const asset = this.blogAssets[blog.id];
          if (!asset || !asset.readmeText) {
            return this.t("fallback.contentUnavailable");
          }
          return asset.readmeText;
        },

        escapeHtml(value) {
          return String(value || "").replace(/[&<>"']/g, ch => {
            const map = {
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;'
            };
            return map[ch] || ch;
          });
        },

        renderInlineMarkdown(text) {
          let out = this.escapeHtml(text);
          out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
          out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
          out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
          out = out.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
          return out;
        },

        isPipeRow(line) {
          const trimmed = String(line || "").trim();
          return trimmed.includes('|');
        },

        isTableSeparatorRow(line) {
          const trimmed = String(line || "").trim();
          if (!trimmed.includes('|')) {
            return false;
          }
          const normalized = trimmed.replace(/^\|/, '').replace(/\|$/, '');
          return normalized.split('|').every(cell => /^:?-{3,}:?$/.test(cell.trim()));
        },

        parseTableRow(line) {
          const normalized = String(line || "").trim().replace(/^\|/, '').replace(/\|$/, '');
          return normalized.split('|').map(cell => this.renderInlineMarkdown(cell.trim()));
        },

        renderMarkdown(markdownText) {
          const lines = String(markdownText || "").split(/\r?\n/);
          const html = [];
          let inList = false;
          let inQuote = false;

          const closeList = () => {
            if (inList) {
              html.push('</ul>');
              inList = false;
            }
          };

          const closeQuote = () => {
            if (inQuote) {
              html.push('</blockquote>');
              inQuote = false;
            }
          };

          let i = 0;
          while (i < lines.length) {
            const line = lines[i].trim();

            if (!line) {
              closeList();
              closeQuote();
              i += 1;
              continue;
            }

            if (this.isPipeRow(line) && i + 1 < lines.length && this.isTableSeparatorRow(lines[i + 1])) {
              closeList();
              closeQuote();
              const headerCells = this.parseTableRow(line);
              html.push('<table><thead><tr>');
              headerCells.forEach(cell => html.push(`<th>${cell}</th>`));
              html.push('</tr></thead><tbody>');

              i += 2;
              while (i < lines.length && this.isPipeRow(lines[i].trim()) && !this.isTableSeparatorRow(lines[i].trim())) {
                const rowCells = this.parseTableRow(lines[i]);
                html.push('<tr>');
                rowCells.forEach(cell => html.push(`<td>${cell}</td>`));
                html.push('</tr>');
                i += 1;
              }
              html.push('</tbody></table>');
              continue;
            }

            if (line.startsWith('>')) {
              closeList();
              if (!inQuote) {
                html.push('<blockquote>');
                inQuote = true;
              }
              const quotedText = line.replace(/^>\s?/, '').trim();
              if (quotedText) {
                html.push(`<p>${this.renderInlineMarkdown(quotedText)}</p>`);
              }
              i += 1;
              continue;
            }

            closeQuote();

            if (line.startsWith('### ')) {
              closeList();
              html.push(`<h3>${this.renderInlineMarkdown(line.slice(4))}</h3>`);
              i += 1;
              continue;
            }

            if (line.startsWith('## ')) {
              closeList();
              html.push(`<h2>${this.renderInlineMarkdown(line.slice(3))}</h2>`);
              i += 1;
              continue;
            }

            if (line.startsWith('# ')) {
              closeList();
              html.push(`<h1>${this.renderInlineMarkdown(line.slice(2))}</h1>`);
              i += 1;
              continue;
            }

            if (line.startsWith('- ')) {
              if (!inList) {
                html.push('<ul>');
                inList = true;
              }
              html.push(`<li>${this.renderInlineMarkdown(line.slice(2))}</li>`);
              i += 1;
              continue;
            }

            closeList();
            html.push(`<p>${this.renderInlineMarkdown(line)}</p>`);
            i += 1;
          }

          closeList();
          closeQuote();
          return html.join('');
        },

        selectedBlogParts() {
          const blog = this.selectedBlog();
          if (!blog) {
            return [];
          }
          const asset = this.blogAssets[blog.id];
          return Array.isArray(asset && asset.partsList) ? asset.partsList : [];
        },

        openTutorial(id) {
          this.panelFocus = "tutorials";
          this.isExpandedView = false;
          this.selectedTutorialId = id;
          const tutorial = this.raw.tutorials.find(item => item.id === id) || null;
          if (tutorial) {
            this.ensureTutorialAssets(tutorial);
          }
          this.loadVotesForKey(`tutorial:${id}`);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        tutorialReadmePath(tutorial) {
          if (!tutorial) {
            return "";
          }
          if (tutorial.readme) {
            return tutorial.readme;
          }
          const base = String(tutorial.url || "");
          if (!base) {
            return "";
          }
          return base.endsWith('/') ? `${base}README.md` : `${base}/README.md`;
        },

        async ensureTutorialAssets(tutorial) {
          if (!tutorial || !tutorial.id) {
            return;
          }

          const cached = this.tutorialAssets[tutorial.id];
          if (cached && cached.loaded) {
            return;
          }

          const inlineReadme = String(
            tutorial.readme_text ||
            tutorial.readmeText ||
            tutorial.content_md ||
            tutorial.contentMd ||
            ""
          ).trim();

          let readmeText = inlineReadme || this.t("fallback.contentUnavailable");
          const readmePath = this.tutorialReadmePath(tutorial);
          if (readmePath && !inlineReadme) {
            try {
              const readmeRes = await fetch(readmePath);
              if (readmeRes.ok) {
                const txt = (await readmeRes.text()).trim();
                if (txt) {
                  readmeText = txt;
                }
              }
            } catch (_) {
              readmeText = this.t("fallback.contentUnavailable");
            }
          }

          this.tutorialAssets[tutorial.id] = {
            loaded: true,
            readmeText
          };
        },

        selectedTutorial() {
          if (!this.selectedTutorialId) return null;
          return this.visible.tutorials.find(item => item.id === this.selectedTutorialId) || null;
        },

        selectedTutorialReadme() {
          const tutorial = this.selectedTutorial();
          if (!tutorial) {
            return this.t("fallback.contentUnavailable");
          }
          const asset = this.tutorialAssets[tutorial.id];
          if (!asset || !asset.readmeText) {
            return this.t("fallback.contentUnavailable");
          }
          return asset.readmeText;
        },

        selectedTutorialIndex() {
          if (!this.selectedTutorialId) {
            return -1;
          }
          return this.visible.tutorials.findIndex(item => item.id === this.selectedTutorialId);
        },

        openPrevTutorial() {
          if (!this.visible.tutorials.length) {
            return;
          }
          const index = this.selectedTutorialIndex();
          if (index < 0) {
            return;
          }
          const prevIndex = (index - 1 + this.visible.tutorials.length) % this.visible.tutorials.length;
          this.openTutorial(this.visible.tutorials[prevIndex].id);
        },

        openNextTutorial() {
          if (!this.visible.tutorials.length) {
            return;
          }
          const index = this.selectedTutorialIndex();
          if (index < 0) {
            return;
          }
          const nextIndex = (index + 1) % this.visible.tutorials.length;
          this.openTutorial(this.visible.tutorials[nextIndex].id);
        },

        openPart(ref) {
          this.panelFocus = "parts";
          this.isExpandedView = false;
          this.selectedPartRef = ref;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        selectedPart() {
          if (!this.selectedPartRef) return null;
          return this.visible.components.find(c => c._ref === this.selectedPartRef) || null;
        },

        selectedPartIndex() {
          if (!this.selectedPartRef) {
            return -1;
          }
          return this.visible.components.findIndex(c => c._ref === this.selectedPartRef);
        },

        openPrevPart() {
          if (!this.visible.components.length) {
            return;
          }
          const index = this.selectedPartIndex();
          if (index < 0) {
            return;
          }
          const prevIndex = (index - 1 + this.visible.components.length) % this.visible.components.length;
          this.openPart(this.visible.components[prevIndex]._ref);
        },

        openNextPart() {
          if (!this.visible.components.length) {
            return;
          }
          const index = this.selectedPartIndex();
          if (index < 0) {
            return;
          }
          const nextIndex = (index + 1) % this.visible.components.length;
          this.openPart(this.visible.components[nextIndex]._ref);
        },

        projectSlugFromPath(path) {
          const match = String(path || "").match(/blog\/([^/]+)\//);
          return match ? match[1] : "";
        },

        projectBySlug(slug) {
          if (!slug) {
            return null;
          }
          return this.raw.projects.find(item => {
            const readmeSlug = this.projectSlugFromPath(item.readme);
            const partsSlug = this.projectSlugFromPath(item.parts);
            const inlineSlug = String(item.slug || item.project_slug || item.id || "");
            return readmeSlug === slug || partsSlug === slug || inlineSlug === slug;
          }) || null;
        },

        projectLabelFromSlug(slug) {
          const project = this.projectBySlug(slug);
          return project ? project.title : slug;
        },

        openProjectBySlug(slug) {
          const project = this.projectBySlug(slug);
          if (project) {
            this.openBlog(project.id);
          }
        },

        openTool(id) {
          this.panelFocus = "tools";
          this.isExpandedView = false;
          this.selectedToolId = id;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        selectedTool() {
          if (!this.selectedToolId) return null;
          return this.visible.tools.find(t => t.id === this.selectedToolId) || null;
        },

        selectedToolIndex() {
          if (!this.selectedToolId) {
            return -1;
          }
          return this.visible.tools.findIndex(t => t.id === this.selectedToolId);
        },

        openPrevTool() {
          if (!this.visible.tools.length) {
            return;
          }
          const index = this.selectedToolIndex();
          if (index < 0) {
            return;
          }
          const prevIndex = (index - 1 + this.visible.tools.length) % this.visible.tools.length;
          this.openTool(this.visible.tools[prevIndex].id);
        },

        openNextTool() {
          if (!this.visible.tools.length) {
            return;
          }
          const index = this.selectedToolIndex();
          if (index < 0) {
            return;
          }
          const nextIndex = (index + 1) % this.visible.tools.length;
          this.openTool(this.visible.tools[nextIndex].id);
        },

        totalResults() {
          return this.visible.projects.length +
            this.visible.components.length +
            this.visible.tutorials.length +
            this.visible.tools.length;
        },

        setPanel(name) {
          if (this.isSearchMode()) {
            return;
          }
          this.panelFocus = name;
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        jumpToPanel(name) {
          if (this.isSearchMode()) {
            return;
          }
          this.panelFocus = name;
          window.scrollTo({ top: 0, behavior: 'auto' });
        },

        activePanel() {
          return this.isSearchMode() ? "default" : this.panelFocus;
        },

        isNavActive(name) {
          const active = this.activePanel();
          if (active === "default") {
            return name === this.defaultNavPanel();
          }
          return active === name;
        },

        showLarge(name) {
          const active = this.activePanel();
          if (active === "default") {
            return this.defaultLargePanels().includes(name);
          }
          return active === name;
        },

        showCompact(name) {
          const active = this.activePanel();
          if (active === "default") {
            return this.defaultCompactPanels().includes(name);
          }
          return true;
        },

        compactOrder(name) {
          const active = this.activePanel();
          if (active === name) return 0;
          const order = this.defaultCompactOrder();
          const index = order.indexOf(name);
          return index >= 0 ? index + 1 : 999;
        }
      };
    }
  </script>
</body>
