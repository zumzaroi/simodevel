            renderChart(chart, [], "No data", hMetaByH, { showProvenance: showProvenanceInput.checked, lookupMarker });
            applyPageZoom();
            return;
          }

          const h = hInput.value;
          const sp = spInput.value;
          const rankMode = rankModeInput.value === "min" ? "min" : "max";
          const { filtered, groupedRows, hFilterText, uniqueSpGroups } = buildIntervals(rows, h, sp, rankMode);
          const allHNames = [...new Set(rows.map(r => (r.h || "").trim()).filter(Boolean))];
          const allCount2024 = gradeRows.filter(r => r.__year === "2024").length;
          const allCount2025 = gradeRows.filter(r => r.__year === "2025").length;
          const allCount2026 = gradeRows.filter(r => r.__year === "2026").length;

          if (!filtered.length) {
            const lookupSummary = formatLookupMarkerSummary(lookupMarker);
            meta.textContent = `No matches found for nume liceu=${h}${sp ? ` and specializare=${sp}` : ""}.${lookupSummary ? ` ${lookupSummary}` : ""}`;
            const gradeTitle = "Note vs numar de elevi";
            lastGradeView = renderGradeChart(gradeChart, gradeRows, gradeTitle, { zoom: gradeZoom, center: gradeCenter, lookupMarker }) || null;
            if (lastGradeView) gradeCenter = lastGradeView.center;
            renderChart(chart, [], "No data", hMetaByH, { showProvenance: showProvenanceInput.checked, lookupMarker });
            applyPageZoom();
            return;
          }

          const hNames = [...new Set(filtered.map(r => (r.h || "").trim()).filter(Boolean))];
          const spFilterText = sp.trim() ? sp.trim() : "ALL";
          const count2024 = filtered.filter(r => r.__year === "2024").length;
          const count2025 = filtered.filter(r => r.__year === "2025").length;
          meta.textContent = "";

          const gradeTitle = "Note vs numar de elevi";
          lastGradeView = renderGradeChart(gradeChart, gradeRows, gradeTitle, { zoom: gradeZoom, center: gradeCenter, lookupMarker }) || null;
          if (lastGradeView) gradeCenter = lastGradeView.center;

          const title = `TOP_PLACE intervals by specializare for nume liceu: ${hFilterText}, specializare:${spFilterText}, sortare dupa medie ${rankMode.toLowerCase()}. 2025`;
          renderChart(chart, groupedRows, title, hMetaByH, { showProvenance: showProvenanceInput.checked, lookupMarker });
          applyPageZoom();
        } catch (err) {
          lastGradeView = null;
          meta.innerHTML = `<span class="error">${String(err.message || err)}</span>`;
          renderGradeChart(gradeChart, [], "Error");
          renderChart(chart, [], "Error", hMetaByH, { showProvenance: showProvenanceInput.checked });
          applyPageZoom();
        }
      };

      try {
        for (const year of Object.keys(YEAR_CONFIG)) {
          const rows = getBundledYearRows(year);
          if (rows.length) {
            rowsByYear.set(year, tagRowsWithYear(rows, year));
          }
        }

        for (const year of Object.keys(GRADE_ONLY_YEAR_CONFIG)) {
          const rows = getBundledYearRows(year);
          if (rows.length) {
            gradeOnlyRowsByYear.set(year, tagRowsWithYear(rows, year));
          }
        }

        meta.textContent = "";
      } catch (err) {
        meta.innerHTML = `<span class="error">${String(err.message || err)}.</span>`;
      }

      try {
        const res = await fetch(H_META_JSON_PATH, { cache: "no-cache" });
        if (res.ok) {
          const raw = await res.text();
          const hMetaRows = parseHMetaData(raw);
          hMetaByH = buildHMetaMap(hMetaRows);
        }
      } catch (_err) {
        // Optional companion file; ignore if missing/unavailable.
      }

      applyPageZoom();

      const panHistogram = (direction) => {
        if (!lastGradeView) return;
        const step = Math.max(0.01, lastGradeView.xSpan * 0.25);
        const currentCenter = Number.isFinite(gradeCenter) ? gradeCenter : lastGradeView.center;
        gradeCenter = currentCenter + (direction * step);
        render();
      };

      const panHistogramByPixels = (deltaX) => {
        if (!lastGradeView) return;
        const unitsPerPixel = lastGradeView.xSpan / Math.max(1, lastGradeView.plotW);
        const currentCenter = Number.isFinite(gradeCenter) ? gradeCenter : lastGradeView.center;
        gradeCenter = currentCenter - (deltaX * unitsPerPixel);
        render();
      };

      const renderLive = debounce(() => {
        render();
      }, 180);

      hInput.addEventListener("input", renderLive);
      spInput.addEventListener("input", renderLive);
      studentLookupInput.addEventListener("input", renderLive);
      hInput.addEventListener("keydown", e => { if (e.key === "Enter") render(); });
      spInput.addEventListener("keydown", e => { if (e.key === "Enter") render(); });
      studentLookupInput.addEventListener("keydown", e => { if (e.key === "Enter") render(); });
      rankModeInput.addEventListener("change", render);
      showProvenanceInput.addEventListener("change", render);
      show2024Input.addEventListener("change", render);
      show2025Input.addEventListener("change", render);
      show2026Input.addEventListener("change", render);
      gradePanLeftBtn.addEventListener("click", () => panHistogram(-1));
      gradePanRightBtn.addEventListener("click", () => panHistogram(1));
      gradeZoomOutBtn.addEventListener("click", () => {
        if (lastGradeView) gradeCenter = lastGradeView.center;
        gradeZoom = Math.max(1, gradeZoom / 1.25);
        render();
      });
      gradeZoomInBtn.addEventListener("click", () => {
        if (lastGradeView) gradeCenter = lastGradeView.center;
        gradeZoom = Math.min(40, gradeZoom * 1.25);
        render();
      });
      gradeZoomResetBtn.addEventListener("click", () => {
        gradeZoom = 1;
        gradeCenter = null;
        render();
      });
      gradeChart.style.cursor = "grab";
      gradeChart.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        if (!lastGradeView) return;
        isGradeDragging = true;
        gradeDragLastX = e.clientX;
        gradeChart.style.cursor = "grabbing";
        e.preventDefault();
      });
      window.addEventListener("mousemove", (e) => {
        if (!isGradeDragging) return;
        const dx = e.clientX - gradeDragLastX;
        gradeDragLastX = e.clientX;
        if (Math.abs(dx) < 0.5) return;
        panHistogramByPixels(dx);
      });
      window.addEventListener("mouseup", () => {
        if (!isGradeDragging) return;
        isGradeDragging = false;
        gradeChart.style.cursor = "grab";
      });
      gradeChart.addEventListener("wheel", (e) => {
        if (!lastGradeView) return;

        const rect = gradeChart.getBoundingClientRect();
        if (rect.width <= 0 || rect.height <= 0) return;
        const vb = gradeChart.viewBox && gradeChart.viewBox.baseVal ? gradeChart.viewBox.baseVal : null;
        const vbW = vb && Number.isFinite(vb.width) && vb.width > 0 ? vb.width : rect.width;
        const vbH = vb && Number.isFinite(vb.height) && vb.height > 0 ? vb.height : rect.height;
        const x = ((e.clientX - rect.left) / rect.width) * vbW;
        const y = ((e.clientY - rect.top) / rect.height) * vbH;
        const insideHistogramPlot = (
          x >= lastGradeView.plotLeft &&
          x <= lastGradeView.plotRight &&
          y >= lastGradeView.plotTop &&
          y <= lastGradeView.plotBottom
        );
        // If mouse is near the histogram (outside plot area), allow normal page scroll.
        if (!insideHistogramPlot) return;

        e.preventDefault();
        if (e.shiftKey) {
          panHistogram(e.deltaY > 0 ? 1 : -1);
          return;
        }
        if (lastGradeView) gradeCenter = lastGradeView.center;
        const factor = e.deltaY < 0 ? 1.2 : (1 / 1.2);
        gradeZoom = Math.min(40, Math.max(1, gradeZoom * factor));
        render();
      }, { passive: false });

      chartWrap.addEventListener("wheel", (e) => {
        if (!e.ctrlKey) return;
        const insideGantt = e.target === chart || chart.contains(e.target);
        const insideGrade = e.target === gradeChart || gradeChart.contains(e.target);
        if (!insideGantt || insideGrade) return;
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : (1 / 1.15);
        setPageZoom(pageZoom * factor);
      }, { passive: false });

      chartWrap.addEventListener("touchstart", (e) => {
        if (e.touches.length !== 2) return;
        pinchStartDistance = touchDistance(e.touches[0], e.touches[1]);
        pinchStartZoom = pageZoom;
      }, { passive: true });

      chartWrap.addEventListener("touchmove", (e) => {
        if (e.touches.length !== 2 || !pinchStartDistance) return;
        const currentDistance = touchDistance(e.touches[0], e.touches[1]);
        if (!Number.isFinite(currentDistance) || currentDistance <= 0) return;
        e.preventDefault();
        setPageZoom(pinchStartZoom * (currentDistance / pinchStartDistance));
      }, { passive: false });

      chartWrap.addEventListener("touchend", () => {
        pinchStartDistance = null;
      }, { passive: true });

      chartWrap.addEventListener("touchcancel", () => {
        pinchStartDistance = null;
      }, { passive: true });

      window.addEventListener("resize", render);
      render();
    }

    boot();
  </script>
</body>
</html>
